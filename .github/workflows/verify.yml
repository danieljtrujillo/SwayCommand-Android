name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - run: node scripts/audit-public.cjs
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - name: Test MIDI parsers
        run: |
          mkdir -p build/tests
          javac -d build/tests android/src/com/gantasmo/swaycommand/MidiStream.java android/src/com/gantasmo/swaycommand/UsbMidiPackets.java tests/MidiStreamTest.java tests/UsbMidiPacketsTest.java
          java -cp build/tests MidiStreamTest
          java -cp build/tests UsbMidiPacketsTest
